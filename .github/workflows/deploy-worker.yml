name: 실시간 서버 배포 (Cloudflare)

# worker/ 폴더나 종목 데이터가 바뀌거나 손으로 실행하면 Cloudflare에 실시간 중계 서버를 올려요.
# 올리기 전에 ① 앱이 쓰는 종목 목록(allow.js)을 새로 만들고 ② 보안 시험을 돌려요. 시험이 하나라도 실패하면 올리지 않아요.
# 키는 GitHub Secrets → Cloudflare 비밀값으로만 옮기고, 로그에 남기지 않아요.
on:
  workflow_dispatch:
    inputs:
      lockdown:
        description: "긴급 정지 (켜면 상태 확인 말고 서버를 모두 멈춰요. 버튼 정지는 다음 자동 배포 때 풀려요. 계속 멈추려면 ops/LOCKDOWN을 1로)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["worker/**", "scripts/gen_allow.py", "data/holdings.json", "data/etfs.json", "ops/watchlist.json", "ops/LOCKDOWN", ".github/workflows/deploy-worker.yml"]
  schedule:
    - cron: "7 23 * * 0-4"   # 한국 평일 08:07 (아침 구성종목 갱신 뒤, 새 종목을 서버 목록에 반영)

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 필요한 값이 있는지 확인
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$T" ] || { echo "::error::GitHub Secrets에 CLOUDFLARE_API_TOKEN이 없어요"; exit 1; }
          [ -n "$A" ] || { echo "::error::GitHub Secrets에 CLOUDFLARE_ACCOUNT_ID가 없어요"; exit 1; }

      - name: 긴급 정지 여부 정하기 (ops/LOCKDOWN 파일이 1이거나, 손으로 실행할 때 lockdown을 켰으면 정지)
        id: lock
        run: |
          v=0
          [ "$(tr -d '[:space:]' < ops/LOCKDOWN 2>/dev/null)" = "1" ] && v=1
          [ "${{ inputs.lockdown }}" = "true" ] && v=1
          echo "v=$v" >> "$GITHUB_OUTPUT"
          [ "$v" = "1" ] && echo "::warning::긴급 정지 상태로 올려요" || true

      - name: 앱이 쓰는 종목 목록 만들기
        run: python3 scripts/gen_allow.py

      - name: 보안 시험 (실패하면 올리지 않아요)
        run: node worker/test/security.test.mjs

      - name: 저장소(KV) 준비 (없으면 만들고, 서버 설정에 연결)
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$A/storage/kv/namespaces"
          id=$(curl -s -H "Authorization: Bearer $T" "$api?per_page=100" | jq -r '.result[]? | select(.title=="gnomon-snap") | .id' | head -1)
          if [ -z "$id" ]; then
            id=$(curl -s -X POST -H "Authorization: Bearer $T" -H "content-type: application/json" -d '{"title":"gnomon-snap"}' "$api" | jq -r '.result.id // empty')
          fi
          if [ -n "$id" ]; then
            printf '\n[[kv_namespaces]]\nbinding = "SNAP"\nid = "%s"\n' "$id" >> worker/wrangler.toml
            echo "저장소 연결됨"
          else
            echo "::warning::Cloudflare 토큰에 저장소(Workers KV) 권한이 없어요. 미리 받아 두기 없이 올려요 (ops/SECURITY.md 참고)"
          fi

      - name: Cloudflare에 올리기
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --var MAINTENANCE:${{ steps.lock.outputs.v }}
          secrets: |
            FINNHUB_API_KEY
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

      - name: 한국투자증권 키 넣기 (있을 때만)
        id: kis
        env:
          K: ${{ secrets.KIS_APP_KEY }}
        run: echo "has=$([ -n "$K" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: 한국투자증권 키 올리기
        if: steps.kis.outputs.has == 'yes'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --var MAINTENANCE:${{ steps.lock.outputs.v }}
          secrets: |
            KIS_APP_KEY
            KIS_APP_SECRET
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}

      - name: 올라간 서버 확인
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "서버 주소: $URL"
          sleep 5
          if [ "${{ steps.lock.outputs.v }}" = "1" ]; then
            curl -fsS "$URL/health" && echo
            [ "$(curl -s -o /dev/null -w "%{http_code}" "$URL/quote?s=NVDA")" = "503" ] && echo "긴급 정지 확인: 서버가 멈췄어요" && exit 0
            echo "::error::긴급 정지가 적용되지 않았어요"; exit 1
          fi
          curl -fsS "$URL/health" && echo
          curl -fsS "$URL/quote?s=NVDA,QQQ" | head -c 400 && echo
          curl -fsS "$URL/fx" && echo
          # 실제 서버에서도 막혀야 할 것들이 막히는지 확인 (막히지 않으면 실패로 표시)
          code() { curl -s -o /dev/null -w "%{http_code}" "$@"; }
          [ "$(code -X POST "$URL/quote?s=NVDA")" = "405" ] || { echo "::error::POST가 막히지 않았어요"; exit 1; }
          [ "$(code "$URL/quote?s=ZZZZZ")" = "400" ] || { echo "::error::앱에 없는 종목이 막히지 않았어요"; exit 1; }
          [ "$(code "$URL/quote?s=NVDA&x=1")" = "400" ] || { echo "::error::모르는 질문 칸이 막히지 않았어요"; exit 1; }
          [ "$(code "$URL/admin")" = "404" ] || { echo "::error::없는 주소 응답이 이상해요"; exit 1; }
          curl -sI "$URL/health" | grep -qi "x-content-type-options: nosniff" || { echo "::error::보안 헤더가 없어요"; exit 1; }
          echo "실제 서버 보안 확인 통과"
