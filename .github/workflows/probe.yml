name: 출처 접속 확인 (한 번씩 수동)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/probe_sources.py"]

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_sources.py
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/probe.json /tmp/c.json
          for i in 1 2 3; do git fetch -q origin main && git reset -q --hard origin/main; cp /tmp/c.json data/probe.json; git add data/probe.json; git diff --cached --quiet && exit 0; git commit -q -m "출처 접속 확인"; git push -q && exit 0; sleep 5; done
