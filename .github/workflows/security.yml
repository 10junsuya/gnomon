name: 보안 검사

# 올릴 때마다: ① 키·토큰·개인정보가 저장소에 없는지 ② 데이터에 화면 코드(스크립트·위험 링크)가 숨어 있지 않은지
# ③ 실시간 서버 보안 시험이 통과하는지 확인해요. 실패하면 Argus·Conrad가 아침 브리핑에 올려요.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "29 18 * * *"   # 한국 새벽 03:29 매일 한 번 전체 점검

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: 키·토큰·개인정보 검사
        run: python scripts/secret_scan.py
      - name: 데이터 안전 검사
        run: python scripts/check_data.py
      - name: 실시간 서버 보안 시험
        run: |
          python scripts/gen_allow.py
          node worker/test/security.test.mjs
