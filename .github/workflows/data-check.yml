name: 데이터 검사

# 일정·실적·임무 데이터(data/*.json)가 형식에 맞는지, 앱(index.html)에 똑같이 들어갔는지 확인해요.
on:
  push:
    branches: [main]
    paths: ["data/events.json", "data/missions.json", "data/money.json", "index.html", "scripts/check_data.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/check_data.py
