name: 데이터 검사

# 일정·실적·임무 데이터(data/*.json)가 형식에 맞는지, 앱(index.html)에 똑같이 들어갔는지 확인해요.
on:
  push:
    branches: [main]
    paths: ["data/events.json", "data/missions.json", "data/money.json", "index.html", "scripts/check_data.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/check_data.py
