name: ETF 구성종목 받아오기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch_holdings.py", "scripts/etf_list.py", "data/etfs.json", ".github/workflows/holdings.yml"]
  schedule:
    - cron: "41 22 * * 0-4"   # 한국 시간 평일 아침 07:41 (전날 장 마감 PDF)

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -q openpyxl
      - run: python scripts/fetch_holdings.py
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/holdings.json /tmp/new.json
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/new.json data/holdings.json
            python scripts/check_data.py --embed
            git add data/holdings.json index.html
            git diff --cached --quiet && exit 0
            git commit -q -m "ETF 구성종목 업데이트"
            git push -q && exit 0
            sleep $((i*7))
          done
          exit 1
