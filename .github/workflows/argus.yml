name: Argus · 경비

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: argus
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: 살피기
        id: watch
        run: python scripts/argus.py
        continue-on-error: true
      - name: 새 알림 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/board/argus.md ops/argus/state.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Argus: 새 알림"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
      - name: 긴급이면 실패로 표시(GitHub 알림 메일)
        if: steps.watch.outcome == 'failure'
        run: exit 1
