name: Keene · 화면 QA

# 앱을 실제 브라우저로 열어 모든 화면·계산기·데이터를 검사한다.
# 앱 파일은 수정하지 않고, 보고서와 캡처만 결과물(artifact)로 남긴다.
on:
  push:
    branches: [main]
    paths: ["index.html", "qa/**", ".github/workflows/qa.yml"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 23 * * 5"   # 매주 토요일 08:17 (한국 시간), AI 검토(08:49) 직전

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: 설치
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: 검사 실행
        run: python qa/run_qa.py --app index.html --out qa-out --strict
      - name: 요약
        if: always()
        run: cat qa-out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: 보고서·캡처 저장
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-report
          path: qa-out
          retention-days: 30
